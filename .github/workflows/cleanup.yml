name: A cleanup step that always runs

on: push

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Start test database
        run: echo "test databases"
      - name: Flaky check
        if: failure()
        run: ./test.sh 
      - name: Stop test database
        if: always() 
        run: echo "stop test databses"

